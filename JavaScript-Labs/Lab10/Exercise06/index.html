<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab 10 - Exercise 06: Simple jQuery animation</title>
    <link rel="stylesheet" href="css/effects.css">
    <!-- jQuery từ CDN -->
    <script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
    <!-- Dự phòng: nếu CDN không tải được thì dùng bản jQuery nội bộ -->
    <script>
        window.jQuery || document.write('<script src="js/jquery-3.1.1.min.js"><\/script>');
    </script>
</head>
<body>

<main>
    <div id="commandLine">
        <button id="btnFadeIn">Fade In</button>
        <button id="btnFadeOut">Fade Out</button>
        <button id="btnFade">Toggle Fade</button>
        <button id="btnSlideUp">Slide Up</button>
        <button id="btnSlideDown">Slide Down</button>
        <button id="btnSlide">Toggle Slide</button>
    </div>
    <figure>
        <img src="images/travel/medium/5855774224.jpg" alt="Battle, UK">
    </figure>
</main>

    <script src="js/main.js"></script>
</body>
</html>
