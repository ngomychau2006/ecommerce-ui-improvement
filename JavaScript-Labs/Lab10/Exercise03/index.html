<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab 10 - Exercise 03: Advanced selectors</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.5/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/lab10.css">
    <!-- jQuery từ CDN -->
    <script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
    <!-- Dự phòng: nếu CDN không tải được thì dùng bản jQuery nội bộ -->
    <script>
        window.jQuery || document.write('<script src="js/jquery-3.1.1.min.js"><\/script>');
    </script>
</head>
<body class="form-body">

<div class="form-box">
    <h1>Registration</h1>
    <hr>

    <form method="get" action="#" name="sampleForm">
        <label class="icon" for="username">User Name</label>
        <input type="text" name="username" id="username" placeholder="User Name">

        <label class="icon" for="email">Email</label>
        <input type="text" name="email" id="email" placeholder="Email">

        <label class="icon" for="pass1">Password</label>
        <input type="password" name="pass1" id="pass1" placeholder="Password">

        <label class="icon" for="pass2">Password Again</label>
        <input type="password" name="pass2" id="pass2" placeholder="Password">

        <button type="submit"><i class="fa fa-reply fa-fw"></i> Register</button>
    </form>
    <div id="errors" class="hidden"></div>
</div>

    <script src="js/main.js"></script>
</body>
</html>
